[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slimtoken"
version = "0.3.7"
description = "For developers and teams who care about token cost and context headroom. slimtoken rewrites every LLM request — tools, system prompts, message history, and individual user prompts — before it leaves your machine. Runs as a proxy, an MCP server, a CLI, or a plain Python import. MIT, no SaaS, works with Anthropic / OpenAI / Ollama backends."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "greyok00"}]
keywords = ["llm", "anthropic", "openai", "ollama", "proxy", "minify", "context", "llama-server", "async", "mcp", "prompt-reframe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "orjson>=3.9",
    "xxhash>=3.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19"]  # optional faster event loop (linux/mac)

[project.scripts]
slimtoken = "slimtoken.cli:main"
slimtoken-serve = "slimtoken.proxy:main"
slimtoken-mcp = "slimtoken.mcp_server.server:main"
slimtoken-reframe-mcp = "slimtoken.mcp_server.prompt_reframe_server:main"

[tool.setuptools.package-data]
slimtoken = ["data/*.tiktoken"]

[tool.setuptools.packages.find]
where = ["src"]
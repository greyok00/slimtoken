[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slimtoken"
version = "0.3.3"
description = "A standalone, all-on-by-default token-optimization layer for LLM requests: minifies tools, system, and messages (code-fence aware), collapses duplicate tool results, distills old turns, prunes to a token budget, and type-compresses tool output. Drop-in async HTTP(S) proxy for Anthropic, OpenAI, and Ollama backends; also an MCP server (stdio) and a CLI. Ships with orjson/xxhash/tiktoken for fast JSON, hashing, and real token counting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "greyok00"}]
keywords = ["llm", "anthropic", "openai", "ollama", "proxy", "minify", "context", "llama-server", "async", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "orjson>=3.9",
    "xxhash>=3.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19"]  # optional faster event loop (linux/mac)

[project.scripts]
slimtoken = "slimtoken.cli:main"
slimtoken-serve = "slimtoken.proxy:main"
slimtoken-mcp = "slimtoken.mcp_server.server:main"

[tool.setuptools.package-data]
slimtoken = ["data/*.tiktoken"]

[tool.setuptools.packages.find]
where = ["src"]